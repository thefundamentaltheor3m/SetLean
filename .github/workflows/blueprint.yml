name: Compile blueprint

on:
  push:
    branches:
      - main # Trigger on pushes to the default branch
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}  # Group runs by workflow and ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens
  issues: write           # Write access to issues
  pull-requests: write    # Write access to pull requests

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Build project
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          build: true
          lint: false # No lint driver is configured in `lakefile.toml`
          mk_all-check: true

      # See https://github.com/leanprover-community/upstreaming-dashboard-action
      # Generates `home_page/_includes/_upstreaming_dashboard`, used by `home_page/upstreaming.md`
      - name: Generate upstreaming dashboard snippets
        uses: leanprover-community/upstreaming-dashboard-action@cdeaeff56d9531a75a19e8b9106def00c588c688 # main as of 2026-10-12
        with:
          website-directory: home_page
          project-name: SetLean
          branch-name: ${{ github.event.repository.default_branch }}

      # The blueprint is built here rather than by `docgen-action`, which pulls the multi-GB
      # `texlive-full` Docker image on every run. Only the TeX Live packages listed in
      # `blueprint/tex-packages.txt` are installed, and `setup-texlive-action` caches them.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4.1.1
        with:
          package-file: blueprint/tex-packages.txt

      # No system Graphviz: the `pygraphviz` wheel bundles it
      - name: Install blueprint dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install --only-binary pygraphviz leanblueprint

      # Same outputs as `docgen-action` with `blueprint: true`, which the Jekyll site picks up
      - name: Compile blueprint
        run: |
          source "$RUNNER_TEMP/blueprint-venv/bin/activate"
          leanblueprint pdf
          mkdir -p home_page
          cp blueprint/print/print.pdf home_page/blueprint.pdf
          leanblueprint web
          cp -r blueprint/web home_page/blueprint

      - name: Check declarations mentioned in the blueprint exist in Lean code
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Compile documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: false # Built above
          homepage: home_page
