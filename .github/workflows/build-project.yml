name: Build SetLean

# Pushes to `main` are built by `blueprint.yml`, which also saves the Lake cache restored below
on:
  pull_request:
  workflow_dispatch: # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}  # Group runs by workflow and ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and modify PR labels
permissions:
  contents: read          # Read access to repository contents
  pages: write            # Write access to GitHub Pages
  id-token: write         # Write access to ID tokens

jobs:
  # Every list of authors outside `CITATION.cff` is generated from it by `scripts/sync_authors.py`
  check_authors:
    runs-on: ubuntu-latest
    name: Check author lists
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check author lists are in sync with CITATION.cff
        run: |
          python3 -m venv "$RUNNER_TEMP/authors-venv"
          "$RUNNER_TEMP/authors-venv/bin/pip" install pyyaml
          "$RUNNER_TEMP/authors-venv/bin/python" scripts/sync_authors.py --check

  build_project:
    runs-on: ubuntu-latest
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      # Restore the `.lake` cache that `lean-action` in `blueprint.yml` saves on every push to `main`.
      # The exact key never matches on a PR, so this falls back to the newest cache for the same
      # toolchain and manifest. Restore only: saving here would let PR caches evict `main`'s.
      - name: Restore Lake cache from main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.lake # Must match `lean-action`'s path exactly, or the cache version differs and nothing is restored
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Build project
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: false
          build: true
          mk_all-check: true
          use-github-cache: false
          use-mathlib-cache: true

      # Check that every `\lean{...}` in the blueprint names a real declaration, without the
      # full blueprint build: plasTeX (`leanblueprint web`) writes `blueprint/lean_decls`
      # and needs no TeX distribution; the PDF and API docs are only built on `main`.
      # No system Graphviz either: the `pygraphviz` wheel bundles it.
      - name: Install blueprint dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/blueprint-venv"
          "$RUNNER_TEMP/blueprint-venv/bin/pip" install --only-binary pygraphviz leanblueprint

      - name: Compile web blueprint
        run: |
          source "$RUNNER_TEMP/blueprint-venv/bin/activate"
          leanblueprint web

      - name: Check declarations mentioned in the blueprint exist in Lean code
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls
